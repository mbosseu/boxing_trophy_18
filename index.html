<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxing Trophy 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Boldonse&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Montserrat:wght@900&display=swap">
<style>
:root{
  --bg-0:#1c0f0d; --bg-1:#120a09; --bg-2:#0a0807;
  --cream:#f3ebdf; --white:#f6faf9;
  --mist:rgba(246,250,249,.72); --mist-2:rgba(246,250,249,.38);
  --gold-1:#e8ab36; --gold-2:#ffc570;
  --ease:cubic-bezier(.16,1,.3,1);
  --ui:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-2);color:var(--white);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img{max-width:100%}

/* ── Écran de chargement ── */
/* ── Préface ── */
.pf{position:fixed;inset:0;z-index:60;overflow:hidden;background:#efe9e1}
.pf.gone{display:none}
.pf-scene{position:absolute;inset:-3%;will-change:transform,filter}
.pf-plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 44%;display:block}
.pf-sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.0) 38%,rgba(255,250,235,.9) 47%,rgba(255,236,190,.6) 50%,rgba(255,255,255,0) 60%,transparent 70%) 0 0/250% 100% no-repeat}
.pf-center{position:absolute;left:0;right:0;top:44.5%;transform:translateY(-50%);display:grid;justify-items:center;gap:var(--pf-gap,18px);pointer-events:none}
.pf-logo-wrap{width:var(--pf-w,520px);aspect-ratio:1040/388;perspective:900px}
.pf-logo{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.pf-logo .ly{left:0;top:0;width:100%;height:100%}
.pf-shadow{position:absolute;inset:0;width:100%;height:100%;filter:brightness(0) blur(10px);opacity:0;transform:translateZ(-60px);will-change:transform,opacity}
.pf-txt{margin:0;display:flex;gap:0;font:500 var(--pf-fs,15px)/1 Montserrat,Geist,sans-serif;letter-spacing:.52em;margin-right:-.52em;text-transform:uppercase;color:#2b221b;white-space:nowrap}
.pf-txt span{display:inline-block;opacity:0;will-change:transform,opacity,filter}
.pf-line{display:flex;align-items:center;gap:10px;width:calc(var(--pf-w,520px)*1.04)}
.pf-track{flex:1;height:1.5px;display:flex;justify-content:flex-end;background:rgba(150,110,50,.12)}
.pf-track.r{justify-content:flex-start}
.pf-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(201,150,60,0),#c99a45 30%,#f1d38c 70%,#b07a22)}
.pf-track.r i{background:linear-gradient(270deg,rgba(201,150,60,0),#c99a45 30%,#f1d38c 70%,#b07a22)}
.pf-dia{width:12px;height:12px;transform:rotate(45deg);background:linear-gradient(135deg,#fff3cf 0%,#e8b85a 35%,#8a5a18 55%,#f6d98e 80%,#fff 100%);box-shadow:0 0 10px rgba(255,210,120,.8),0 1px 2px rgba(80,50,10,.5)}
.pf-dim{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(120% 90% at 50% 42%,rgba(28,15,13,.6),#120a09 55%,#0a0807)}
.dust{position:fixed;inset:0;width:100%;height:100%;z-index:61;pointer-events:none}

/* ── Scène ── */
.stage{position:fixed;inset:0;z-index:1;overflow:hidden;background:radial-gradient(120% 90% at 50% 42%,var(--bg-0),var(--bg-1) 55%,var(--bg-2));opacity:0;transition:opacity .9s var(--ease)}
.stage.on{opacity:1}
.stage::before{content:"";position:absolute;left:50%;top:56%;width:90vmin;height:90vmin;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,150,90,.2),rgba(200,40,30,.07) 55%,transparent);pointer-events:none}
.cards{position:absolute;inset:0;z-index:3}
.card{position:absolute;left:0;top:0;width:var(--cw);aspect-ratio:4/5;will-change:transform,filter,opacity;opacity:0;box-shadow:0 10px 26px rgba(0,0,0,.55)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card b{position:absolute;left:6%;right:6%;bottom:7%;text-align:center;font:400 calc(var(--cw)*.075)/1.2 Boldonse,sans-serif;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.45)}
.stage{--cw:clamp(30px,8.6vmin,100px)}
html,body{overflow-x:hidden}

.trophy{position:absolute;left:0;top:0;z-index:8;width:200px;aspect-ratio:900/984;opacity:0;will-change:transform,opacity}
.trophy img{display:block;width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 52% 54% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 52% 54% at 50% 50%,#000 70%,transparent 100%)}

/* ── En-tête ── */
.top{position:fixed;inset:0 0 auto;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:22px 36px 0;padding-top:max(22px,env(safe-area-inset-top,0px));pointer-events:none;opacity:0;transition:opacity .8s var(--ease)}
.on-ready .top{opacity:1}
.logo{justify-self:start;pointer-events:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.logo img{height:30px;width:auto;display:block}
.brand{display:grid;justify-items:center;gap:6px;text-align:center}
.brand p{margin:0;font:500 10px/1 "Geist Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.ch{position:relative;font:900 26px/1 Montserrat,"Archivo Black",sans-serif;letter-spacing:.015em;text-transform:uppercase}
.ch-gold{color:#b07a22;text-shadow:.4px .5px 0 #f3cd6a,.8px 1px 0 #e0ad45,1.2px 1.5px 0 #c58f2c,1.6px 2px 0 #a8741e,2px 2.5px 0 #8a5c16,2.4px 3px 0 #6d4610,2.8px 3.5px 0 #54350c,3px 6px 12px rgba(0,0,0,.7)}
.ch-face{position:absolute;left:0;top:0;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(104deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 160% 0/260% 100% no-repeat,linear-gradient(#fff,#eef1f4 20%,#c3cad2 41%,#7c8692 49%,#9aa3ad 52%,#e8ecef 60%,#fbfcfc 76%,#b9c1c9) 0 0/100% 100%;-webkit-background-clip:text;background-clip:text;animation:ch-shine 7s cubic-bezier(.4,0,.2,1) 1.5s infinite}
@keyframes ch-shine{0%{background-position:160% 0,0 0}18%,100%{background-position:-60% 0,0 0}}
.menu{justify-self:end;pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#4a3433,#1c1212);border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.35);color:var(--white);cursor:pointer}
.menu span{display:block;width:16px;height:1.5px;background:currentColor;box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor}

/* ── Titre ── */
.hero-t{position:fixed;left:0;right:0;top:var(--ht-top,110px);z-index:2;pointer-events:none;text-align:center;will-change:transform}
.ht-k{display:flex;align-items:center;justify-content:center;gap:26px;margin:0 0 20px;font:400 14px/1 Boldonse,sans-serif;letter-spacing:.82em;text-transform:uppercase;color:var(--cream);transform:skew(-10deg);opacity:0}
.ht-k span{margin-right:-.82em;white-space:nowrap}
.ht-k i{display:block;width:min(16vw,150px);height:1px;transform-origin:100% 50%;transform:scaleX(0);background:linear-gradient(90deg,rgba(243,235,223,0),rgba(243,235,223,.7))}
.ht-k i:last-child{transform-origin:0 50%;background:linear-gradient(90deg,rgba(243,235,223,.7),rgba(243,235,223,0))}
.ht-hw{position:relative}
.ht-h{margin:0;display:flex;justify-content:center;gap:.62em;font:400 var(--ht-size,40px)/1.02 Boldonse,sans-serif;letter-spacing:.01em;white-space:nowrap;transform:skew(-10deg);filter:drop-shadow(0 22px 40px rgba(0,0,0,.6))}
.ht-w{display:inline-flex;overflow:hidden;padding:.24em .3em .34em;margin:-.24em -.3em -.34em}
.ht-c{position:relative;display:inline-block;isolation:isolate;color:transparent;-webkit-text-stroke:.05em #ffdc8e;transform:translate(0,155%) rotate(7deg);will-change:transform}
.ht-c::before,.ht-c::after{content:attr(data-c);position:absolute;left:0;top:0;pointer-events:none}
.ht-c::before{z-index:-1;color:#ffd27e;text-shadow:.0042em .0062em 0 #ffcd74,.0084em .0124em 0 #ffc366,.0126em .0186em 0 #ffba58,.0168em .0248em 0 #ffb049,.021em .031em 0 #f5a440,.0252em .0372em 0 #e89739,.0294em .0434em 0 #dc8b32,.0336em .0496em 0 #cf7e2a,.0378em .0558em 0 #c37223,.042em .062em 0 #b3641d,.0462em .0682em 0 #965418,.0504em .0744em 0 #7a4313,.0546em .0806em 0 #5d320e,.0588em .0868em 0 #402109,.1em .14em .14em rgba(0,0,0,.6)}
.ht-c::after{z-index:1;color:transparent;-webkit-text-stroke:0;background:linear-gradient(#fff,#eef1f3 30%,#b9c0c6 44%,#5f676e 49.5%,#8d959c 51%,#e4e7ea 58%,#fff 74%,#c3c9ce);-webkit-background-clip:text;background-clip:text}
.ht-s{position:absolute;inset:0;color:#fff;filter:none;opacity:.75;-webkit-mask-image:linear-gradient(100deg,transparent 40%,#000 50%,transparent 60%);mask-image:linear-gradient(100deg,transparent 40%,#000 50%,transparent 60%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:var(--sh,120%) 0;mask-position:var(--sh,120%) 0}

/* Logo en relief : 5 éléments à des profondeurs différentes, avec épaisseur, reflet, scintillements */
.lk-wrap{position:relative;margin:0 auto;perspective:1100px;perspective-origin:50% 45%}
.lk{position:relative;width:100%;aspect-ratio:2129/739;transform-style:preserve-3d;will-change:transform}
.ly{position:absolute;transform-style:preserve-3d;opacity:0;will-change:transform,opacity}
.ly img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none}
.ly .mat{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0}
.ly.lit .mat{opacity:1}
.ly.lit .face,.ly.lit .spec{visibility:hidden}
.lk-shadow{position:absolute;inset:0;pointer-events:none;opacity:0;transform:translateZ(-170px)}
.lk-shadow img{width:100%;height:100%;display:block;filter:brightness(0) blur(14px);opacity:.75}
.ly .spec{position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,232,180,.5) 46%,rgba(255,255,255,.95) 50%,rgba(255,232,180,.5) 54%,transparent 62%) 120% 0/300% 100% no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%;transform:translateZ(.6px);opacity:.75;pointer-events:none}
.sp{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:none;opacity:0;transform:translateZ(4px) scale(0);background:radial-gradient(circle,#fff 0 7%,rgba(255,238,200,.85) 13%,transparent 38%),linear-gradient(90deg,transparent 48.5%,#fff 50%,transparent 51.5%),linear-gradient(0deg,transparent 48.5%,#fff 50%,transparent 51.5%);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%)}
.lk.live .sp{opacity:1;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{0%,72%,100%{transform:translateZ(4px) scale(0) rotate(0)}84%{transform:translateZ(4px) scale(1) rotate(45deg)}}
.lk-halo{position:absolute;left:8%;right:8%;top:0;bottom:0;background:radial-gradient(closest-side,rgba(255,170,70,.32),rgba(255,120,40,.1) 60%,transparent);transform:translateZ(-140px) scale(1.35);opacity:0;pointer-events:none}
.lk-refl{position:absolute;left:0;right:0;top:99%;height:42%;overflow:hidden;opacity:0;pointer-events:none;-webkit-mask-image:linear-gradient(rgba(0,0,0,.55),transparent 80%);mask-image:linear-gradient(rgba(0,0,0,.55),transparent 80%)}
.lk-refl img{position:absolute;left:0;top:0;width:100%;height:238.1%;transform:scaleY(-1);filter:blur(1.5px) brightness(.8)}
/* Titre image, découpé en morceaux animés */
.ti{position:relative;width:80vw;aspect-ratio:1700/567;margin:0}
.hint{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:10px;margin:0;font:400 12px/1 "Geist Mono",monospace;letter-spacing:.12em;color:var(--mist-2);opacity:0;transition:opacity .7s var(--ease),translate .7s var(--ease);translate:0 8px;white-space:nowrap}
.intro-done .hint{opacity:1;translate:0 0}
.hint-cue{position:relative;width:1px;height:14px;overflow:hidden;background:rgba(246,250,249,.14)}
.hint-cue::after{content:"";position:absolute;left:0;top:0;width:1px;height:6px;background:var(--gold-2);animation:cue-fall 2.4s cubic-bezier(.6,0,.3,1) infinite}
@keyframes cue-fall{0%{transform:translateY(-6px)}60%,100%{transform:translateY(14px)}}

/* ── Contenu après l'ouverture ── */
main{position:relative;z-index:10;margin-top:100vh;margin-top:100svh}
.panel{width:min(1180px,calc(100% - 32px));margin:0 auto 24px;border-radius:28px;padding:clamp(28px,5vw,56px);background:linear-gradient(165deg,rgba(255,255,255,.17),rgba(255,255,255,.06) 38%,rgba(20,14,16,.22));-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(.92);backdrop-filter:blur(16px) saturate(190%) brightness(.92);border:1px solid rgba(255,255,255,.24);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.7)}
.cap{display:flex;align-items:center;gap:12px;margin:0;font:500 10px/1.4 "Geist Mono",monospace;letter-spacing:.26em;text-transform:uppercase;color:var(--mist)}
.cap::before{content:"";width:26px;height:1px;background:var(--gold-2)}
.panel h2{margin:12px 0 18px;font:600 clamp(30px,4.4vw,52px)/1 Geist,sans-serif;letter-spacing:-.035em;text-wrap:balance}
.panel p{margin:0 0 14px;font:400 15.5px/1.62 Geist,sans-serif;color:rgba(246,250,249,.74);max-width:62ch}
.panel p b{color:var(--white);font-weight:600}
.panel .quote{font:600 19px/1.42 "Lexend Giga","Archivo Black",sans-serif;color:var(--gold-2)}
.film{position:relative;overflow:hidden;border-radius:20px;margin-top:22px;aspect-ratio:16/9;max-height:60vh;width:100%}
.film video{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.25) brightness(.85)}
.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.ticket{border-radius:20px;padding:24px;display:grid;gap:10px;align-content:start;background:rgba(10,7,7,.35);border:1px solid rgba(255,255,255,.14)}
.ticket.vip{border-color:rgba(255,197,112,.6)}
.ticket h3{margin:0;font:600 22px/1.1 Geist,sans-serif;letter-spacing:-.02em}
.price{font:400 26px/1.1 Boldonse,sans-serif;color:var(--gold-2)}
.ticket ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:rgba(246,250,249,.74);font-size:14.5px}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:13px 20px;border-radius:999px;font:500 11px/1 "Geist Mono",monospace;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:#1a0f08;background:linear-gradient(90deg,var(--gold-1),var(--gold-2))}
.btn.ghost{color:var(--white);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22)}
.tbd{border-bottom:1px dashed var(--gold-2)}
footer{position:relative;z-index:10;padding:30px 16px 50px;text-align:center;font:400 11px/1.6 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mist-2)}

@media (max-width:760px),(max-aspect-ratio:1/1){
  .top{padding:14px 16px 0}
  .logo img{height:22px}
  .ch{font-size:19px}
  .brand{display:none}
  .top{grid-template-columns:1fr auto}
  .menu{width:38px;height:38px}
  .ht-k{font-size:9px;gap:12px;letter-spacing:.7em}
  .ht-k i{width:12vw}
  .hint{bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:10px}
  .tickets{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ch-face,.hint-cue::after{animation:none}}
</style>
</head>
<body class="lock">

<!-- Préface : marbre, soie or et argent, logo Boxing Center en relief -->
<div class="pf" id="loader">
  <div class="pf-scene" id="pfScene">
    <img class="pf-plate" id="pfPlate" src="image/intro/pf-plate.jpg" alt="">
    <div class="pf-sheen" id="pfSheen"></div>
  </div>
  <div class="pf-center" id="pfCenter">
    <div class="pf-logo-wrap" id="pfWrap">
      <div class="pf-logo" id="pfLogo">
        <img class="pf-shadow" id="pfShadow" src="image/intro/pf-logo.webp" alt="">
        <div class="ly pf-ly" id="pfLy"><img class="face" src="image/intro/pf-logo.webp" alt="Boxing Center"><canvas class="mat" id="pfMat"></canvas></div>
      </div>
    </div>
    <p class="pf-txt" id="pfTxt" aria-label="On accroche les affiches"></p>
    <div class="pf-line"><span class="pf-track"><i id="bar"></i></span><b class="pf-dia" id="pfDia"></b><span class="pf-track r"><i id="bar2"></i></span></div>
  </div>
  <div class="pf-dim" id="pfDim"></div>
</div>
<canvas class="dust" id="dust" aria-hidden="true"></canvas>

<div class="stage" id="stage" aria-hidden="true">
  <div class="cards" id="cards"></div>
</div>

<div class="hero-t" id="heroT" aria-hidden="true">
  <div class="lk-wrap" id="lkWrap">
    <div class="lk" id="lk">
      <div class="lk-halo" id="lkHalo"></div>
      <div class="lk-shadow" id="lkShadow"><img src="image/intro/lk-full.webp" alt=""></div>
    </div>
    <div class="lk-refl" id="lkRefl" hidden></div>
  </div>
</div>

<header class="top">
  <a class="logo" href="#"><img src="image/intro/logo.png" alt="Boxing Center"></a>
  <div class="brand"><p>Boxing Center · Édition 2027</p></div>
  <button class="menu" type="button" aria-label="Menu"><span></span></button>
</header>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Boxing Trophy 20, la soirée de gala</h1>



<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(id){return document.getElementById(id)};
  function cl(v){return v<0?0:v>1?1:v}
  function eo(t){return 1-Math.pow(1-t,3)}
  function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  function lerp(a,b,t){return a+(b-a)*t}

  /* ── Logo en relief ── */
  // position de chaque élément dans l'image d'origine (en %), profondeur, points de scintillement
  var LAYERS={
    champ:{x:5.589,y:5.277,w:69.61,h:31.529,z:28,sp:[[62.7,69.5],[41.8,64.4],[35.8,67.8],[58.8,69.5],[52.6,79.8]]},
    sub:{x:2.583,y:36.671,w:72.71,h:7.848,z:16,sp:[]},
    boxing:{x:1.362,y:44.384,w:43.166,h:55.616,z:0,sp:[[22.5,24.1],[15.3,46],[36.3,43.1],[46.5,34.8],[18.1,20.4],[10.2,11.2],[67.9,14.4],[87.9,51.1],[39.3,32.1]]},
    word:{x:44.481,y:44.384,w:35.557,h:50.203,z:0,sp:[[27.6,55],[66.3,18.1],[40.7,56.1],[39,20.5],[77.7,50.7],[56.9,22.9],[27.2,27.5],[72.1,10.8]]},
    trophy:{x:75.247,y:2.03,w:24.753,h:89.039,z:12,sp:[[35.9,36.9],[94.3,18.5],[82.2,92.9],[48.6,9.1],[66.4,7],[20.3,48.2],[73.2,79.8],[48.6,56.1],[77.6,47.3]]}
  };
  var lk=$('lk'), lkWrap=$('lkWrap'), lkRefl=$('lkRefl'), lkHalo=$('lkHalo'), lkShadow=$('lkShadow');
  var small=matchMedia('(max-width:760px)').matches, EX=small?5:10, EXD=small?1.6:1.2;
  Object.keys(LAYERS).forEach(function(k,ki){
    var L=LAYERS[k], el=document.createElement('div');el.className='ly ly-'+k;
    el.style.left=L.x+'%';el.style.top=L.y+'%';el.style.width=L.w+'%';el.style.height=L.h+'%';
    var src='image/intro/lk-'+k+'.webp', html='';
    // épaisseur : tranches d'or massif (silhouette pleine), de plus en plus sombres vers l'arrière
    if(k!=='sub') for(var e=EX;e>=1;e--){
      var f=e/EX;
      html+='<img class="ex" src="'+src.replace('.webp','-wall.webp')+'" alt="" style="transform:translateZ('+(-e*EXD).toFixed(1)+'px);filter:brightness('+(1-.62*f).toFixed(2)+')">';
    }

      if(c.ri===0){
        // tombe du bandeau du haut vers sa place sur l'anneau
        var st=T.strip+c.k*.07, dp=eo(cl((t-st)/.55));
        var stripX=vw/2+(c.k-(c.count-1)/2)*(cw*1.35), stripY=-ch*.05;
        appear=cl((t-T.strip+.3)/.3);
        rx=lerp(stripX+cw/2,rx,dp); ry=lerp(stripY+ch/2,ry,dp); rr=lerp(0,rr,dp);
      } else {
        var st2=T.ring1+(c.ri-1)*.35+c.k*.02, dp2=eo(cl((t-st2)/.6));
        appear=dp2; rs=lerp(.4,1,dp2);
      }
      op=appear;
      // nuage en profondeur
      var sl=c.slot, fx, fy, ws, blur, tilt;
      if(sl){ fx=sl[0]*vw; fy=sl[1]*vh; ws=sl[2]*vmin/cw; blur=sl[3]; tilt=sl[4]; }
      else { fx=cx+c.sx*vw*1.4; fy=vh*.5+c.sy*vh*1.4; ws=.6; blur=4; tilt=c.tilt; }
      var bob=Math.sin(t*.6+c.ph)*6, bob2=Math.cos(t*.5+c.ph)*5;
      blur*=sc;
      var X=lerp(rx,fx+bob2,sc), Y=lerp(ry,fy+bob,sc), S=lerp(rs,ws,sc), Rz=lerp(rr,tilt,sc);
      var O=op*(sl?1:1-sc);
      el.style.opacity=O.toFixed(3);
      el.style.visibility=O<.01?'hidden':'visible';
      el.style.transform='translate3d('+(X-cw/2).toFixed(1)+'px,'+(Y-ch/2).toFixed(1)+'px,0) rotate('+Rz.toFixed(1)+'deg) scale('+S.toFixed(3)+')';
      el.style.filter=blur>.3?'blur('+blur.toFixed(1)+'px)':'none';
      el.style.zIndex=sc>.5&&sl?sl[5]:3;
    }

    /* 3. en-tête et titre */
    if(t>T.title-.3)document.body.classList.add('on-ready');

    if(t>T.end&&!done){done=true;document.body.classList.remove('lock');document.body.classList.add('intro-done')}

    /* 4. au défilement : la scène recule doucement */
    var p=cl(scrollY/vh);
    stage.style.transform='scale('+(1-p*.06).toFixed(3)+')';
    stage.style.filter=p>0?'brightness('+(1-p*.5).toFixed(3)+')':'none';
    heroT.style.transform='translate3d(0,'+(-p*vh*.25).toFixed(1)+'px,0) scale('+(1-p*.08).toFixed(3)+')';
    heroT.style.opacity=(1-p*1.2).toFixed(3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // Un clic pendant l'intro la fait passer
  addEventListener('click',function(){ if(!done) start=performance.now()-T.end*1000; });
})();
</script>
