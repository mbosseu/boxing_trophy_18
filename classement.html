<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrophyRec — Classement Boxing Trophy</title>
  <meta name="description" content="Classement officiel Boxing Trophy par categorie : palmares automatique, fiches combattants, salles Boxing Center." />
  <link rel="canonical" href="https://boxing-trophy-20.vercel.app/classement" />
  <link rel="stylesheet" href="/trophyrec.css" />
  <link rel="icon" type="image/png" href="/image/logo_boxing_center.png" />
</head>
<body>
  <nav class="tr-nav">
    <a class="tr-brand" href="/">Boxing Trophy 20</a>
    <a href="/classement" class="is-on">TrophyRec</a>
    <a href="/connexion">Mon espace</a>
    <a href="/#licence">Inscription combat</a>
  </nav>
  <main class="tr-wrap" data-page="classement">
    <p class="tr-note">TrophyRec</p>
    <h1 class="tr-h1">Classement officiel</h1>
    <p class="tr-lead">Palmares calcule automatiquement a partir des resultats saisis par l'organisation. Un classement par discipline, sexe et categorie de poids.</p>
    <div class="tr-filters">
      <select id="fDiscipline" aria-label="Discipline"></select>
      <select id="fSexe" aria-label="Sexe"></select>
      <select id="fPoids" aria-label="Categorie de poids"></select>
    </div>
    <p id="trStatus" class="tr-note">Chargement…</p>
    <div class="tr-table-wrap">
      <table class="tr-table" id="trTable" hidden>
        <thead>
          <tr><th>Rang</th><th>Combattant</th><th>Salle</th><th>Coach</th><th>Palmares</th><th>Points</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="/env-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/trophyrec.js"></script>
  <script src="/trophyrec-public.js"></script>
</body>
</html>
