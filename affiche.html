<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Boxing Trophy 18 — Carte des combats</title>
  <meta name="description" content="Carte officielle des combats du Boxing Trophy 18 — Boxing Center St Cyprien, 5 Juin 2026." />
  <link rel="canonical" href="https://boxing-trophy-18.vercel.app/affiche" />
  <meta property="og:url" content="https://boxing-trophy-18.vercel.app/affiche" />
  <link rel="stylesheet" href="poster.css?v=6" />
  <link rel="icon" type="image/png" href="image/affiche1.png" />
  <link rel="apple-touch-icon" href="image/affiche1.png" />
  <style>
    body { margin: 0; min-height: 100vh; background: #050507; font-family: 'Oswald', sans-serif; }
    .affiche-page-header { text-align: center; padding: 16px 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
    .affiche-page-header a { color: #d4af37; text-decoration: none; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
    .affiche-loading, .affiche-empty { text-align: center; padding: 60px 20px; color: #8b8b9e; font-size: 15px; max-width: 400px; margin: 0 auto; line-height: 1.6; }
    .affiche-soon {
      text-align: center;
      padding: 48px 24px 64px;
      max-width: 480px;
      margin: 0 auto;
    }
    .affiche-soon-icon { font-size: 3rem; display: block; margin-bottom: 16px; opacity: 0.9; }
    .affiche-soon h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d4af37;
      margin: 0 0 12px;
      font-weight: 600;
    }
    .affiche-soon p { color: #a8a8b8; font-size: 15px; line-height: 1.65; margin: 0 0 24px; font-family: 'Inter', sans-serif; }
    .affiche-soon .affiche-soon-back {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #d4af37;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 6px;
    }
    .affiche-soon .affiche-soon-back:hover { background: rgba(212, 175, 55, 0.12); }
    .affiche-toolbar { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; flex-wrap: wrap; }
    .affiche-toolbar button {
      padding: 10px 20px; border: 1px solid rgba(212, 175, 55, 0.4); background: rgba(212, 175, 55, 0.1);
      color: #d4af37; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; border-radius: 6px;
    }
    .affiche-sync-note { font-size: 11px; color: #6b6b7a; letter-spacing: 0.5px; }
    #afficheContainer { padding: 16px 12px 48px; max-width: 100%; overflow-x: hidden; }
    .affiche-public-note { text-align: center; font-size: 12px; color: #8b8b9e; letter-spacing: 1px; margin-bottom: 8px; padding: 0 12px; }
    @media (max-width: 600px) {
      .affiche-toolbar button { width: 100%; max-width: 280px; }
      .affiche-page-header a { font-size: 11px; }
    }
  </style>
</head>
<body>

  <header class="affiche-page-header">
    <a href="index.html">← Retour au Boxing Trophy 18</a>
  </header>

  <p class="affiche-public-note" id="affichePublicNote" hidden></p>

  <div class="affiche-toolbar" id="afficheToolbar" hidden>
    <button type="button" id="printAfficheBtn">Imprimer l'affiche complète</button>
    <span class="affiche-sync-note" id="afficheSyncNote"></span>
  </div>

  <div id="afficheContainer">
    <p class="affiche-loading" id="afficheLoading">Chargement de la carte des combats…</p>
    <div class="affiche-soon" id="afficheSoon" hidden>
      <span class="affiche-soon-icon" aria-hidden="true">🥊</span>
      <h1>Bientôt disponible</h1>
      <p>
        La carte officielle des combats n’est pas encore publiée.
        Revenez prochainement pour découvrir tous les affrontements du Boxing Trophy 18.
      </p>
      <a href="index.html#carte-combats" class="affiche-soon-back">Retour à l’accueil</a>
    </div>
    <p class="affiche-empty" id="afficheEmpty" hidden>La carte est en cours de finalisation.</p>
    <div class="gala-poster-wrap" id="affichePoster" hidden></div>
  </div>

  <script src="env-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="poster.js?v=6"></script>
  <script src="published-matches.js"></script>
  <script>
    (function () {
      var POLL_MS = 3 * 60 * 1000;
      var lastSnapshot = '';

      function showComingSoon() {
        document.getElementById('afficheLoading').hidden = true;
        document.getElementById('afficheSoon').hidden = false;
        document.getElementById('afficheEmpty').hidden = true;
        document.getElementById('affichePoster').hidden = true;
        document.getElementById('afficheToolbar').hidden = true;
        document.getElementById('affichePublicNote').hidden = true;
        window.__afficheMatches = [];
      }

      function loadPublished() {
        return BT18PublishedMatches.loadPublishedMatches();
      }

      function updateSyncNote() {
        var el = document.getElementById('afficheSyncNote');
        if (!el) return;
        el.textContent = 'Mise à jour auto · toutes les 3 min · ' +
          new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      }

      function renderPublished(matches) {
        var poster = document.getElementById('affichePoster');
        var pairs = matches.filter(function (m) { return m.type === 'pair' && m.fighter1 && m.fighter2; });

        if (pairs.length === 0) {
          document.getElementById('afficheLoading').hidden = true;
          document.getElementById('afficheSoon').hidden = true;
          document.getElementById('afficheEmpty').hidden = false;
          document.getElementById('afficheToolbar').hidden = true;
          return;
        }

        document.getElementById('afficheSoon').hidden = true;
        document.getElementById('afficheLoading').hidden = true;
        document.getElementById('afficheEmpty').hidden = true;
        document.getElementById('afficheToolbar').hidden = false;
        poster.hidden = false;

        var hasWinners = typeof GalaPoster !== 'undefined' && GalaPoster.hasWinners(matches);
        var note = document.getElementById('affichePublicNote');
        if (note) {
          note.hidden = false;
          note.textContent = hasWinners
            ? '★ Résultats officiels — mise à jour après la soirée ★'
            : 'Carte officielle — tous les combattants';
        }

        GalaPoster.renderPoster(poster, matches, {
          interactive: false,
          showResults: hasWinners,
          includeWaiting: false
        });
        window.__afficheMatches = matches;
        window.__afficheHasWinners = hasWinners;
        updateSyncNote();
      }

      function applyResult(result) {
        if (!result.published) {
          showComingSoon();
          return;
        }
        renderPublished(result.matches);
      }

      function poll() {
        return loadPublished().then(function (result) {
          var snap = JSON.stringify({
            published: result.published,
            matches: result.matches,
          });
          if (snap !== lastSnapshot) {
            lastSnapshot = snap;
            applyResult(result);
          } else {
            updateSyncNote();
          }
        });
      }

      function runPrint() {
        var wrap = document.getElementById('affichePoster');
        var m = window.__afficheMatches || [];
        var opts = { showResults: !!window.__afficheHasWinners, interactive: false };
        document.documentElement.classList.add('printing-poster');
        document.body.classList.add('printing-poster');
        function doPrint() {
          window.print();
          setTimeout(function () {
            document.documentElement.classList.remove('printing-poster');
            document.body.classList.remove('printing-poster');
            if (wrap && typeof GalaPoster.restoreScreenPoster === 'function') {
              GalaPoster.restoreScreenPoster(wrap, m, Object.assign({}, opts, { includeWaiting: true }));
            }
          }, 800);
        }
        if (typeof GalaPoster !== 'undefined' && wrap) {
          GalaPoster.preparePrintFit(wrap, m, opts, doPrint);
        } else {
          doPrint();
        }
      }

      document.getElementById('printAfficheBtn').addEventListener('click', runPrint);

      loadPublished()
        .then(applyResult)
        .catch(function () {
          document.getElementById('afficheLoading').hidden = true;
          showComingSoon();
        });

      setInterval(poll, POLL_MS);

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) poll();
      });
    })();
  </script>
</body>
</html>
